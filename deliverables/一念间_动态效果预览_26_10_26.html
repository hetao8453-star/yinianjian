<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>一念间 · 动态效果预览</title>
<style>
:root{--paper:#f3f1e7;--card:#faf9f3;--ink:#263029;--muted:#68746b;--green:#507e62;--soft:#e5eee4;--line:#dcdfd4}*{box-sizing:border-box}body{margin:0;background:#e9eae4;color:var(--ink);font:16px/1.55 system-ui,-apple-system,"PingFang SC",sans-serif}.wrap{max-width:430px;margin:20px auto 50px}.caption{text-align:center;font-size:13px;color:#69756b;margin:0 12px 12px}.switches{display:flex;gap:8px;margin:0 12px 12px}.switches button{flex:1;border:0;background:#fff;color:var(--green);border-radius:13px;padding:11px;font-size:15px}.switches button.active{background:var(--green);color:white}.phone{min-height:780px;background:var(--paper);border-radius:32px;padding:30px 25px;box-shadow:0 16px 40px #343e3424;overflow:hidden}.screen{display:none}.screen.active{display:block}.top{display:flex;align-items:center;justify-content:space-between;color:var(--muted);margin-bottom:26px}.app{display:flex;align-items:center;gap:10px}.icon{width:30px;height:30px;background:#e93269;color:white;display:grid;place-items:center;border-radius:6px;font-size:12px;font-weight:700}.close{font-size:27px;line-height:1}.mascot{width:56px;height:56px;object-fit:contain;transform-origin:center bottom;animation:breathe 5.2s ease-in-out infinite}.mascot.big{width:82px;height:82px}h1{font-size:31px;line-height:1.25;letter-spacing:.01em;margin:16px 0 18px;font-weight:750}h2{font-size:22px;margin:0}.sub{color:var(--muted);margin:0 0 24px}.small{font-size:13px;color:var(--muted)}.purpose{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:25px}.purpose button{height:96px;border:1px solid var(--line);border-radius:20px;background:white;color:var(--ink);font-size:20px;font-weight:650}.purpose button.sel{background:var(--soft);border-color:#8bad94}.action{border:0;background:var(--soft);color:var(--green);border-radius:15px;padding:16px;width:100%;font:600 16px system-ui;margin-top:22px}.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:18px}.garden{position:relative;height:270px;border-radius:20px;overflow:hidden;background:linear-gradient(#eff5eb 0%,#f7f4e9 59%,#e0eadb 60%,#e8dec8 100%);transition:background 450ms}.garden.night{background:linear-gradient(#e1eae5 0%,#f3eee4 59%,#d7e5d7 60%,#e5dbc9 100%)}.sky{position:absolute;right:24px;top:20px;font-size:33px;line-height:1;color:#e9c982}.stars{display:none;position:absolute;top:19px;left:25px;color:#88a894;letter-spacing:25px}.night .stars{display:block}.plant{position:absolute;width:50px;height:75px;border:0;background:none;padding:0;cursor:pointer;transform-origin:50% 90%;animation:sway 4.8s ease-in-out infinite alternate}.plant:nth-of-type(even){animation-delay:-2.2s}.plant svg{width:100%;height:100%;filter:drop-shadow(0 2px 1px #4e65431c)}.plant:focus-visible{outline:2px solid var(--green);border-radius:12px}.p1{left:4%;top:95px}.p2{left:25%;top:95px}.p3{left:46%;top:95px}.p4{left:67%;top:95px}.p5{left:9%;top:169px}.p6{left:31%;top:169px}.p7{left:53%;top:169px}.p8{left:63%;top:169px}.garden .mascot{position:absolute;right:0;bottom:1px;width:89px;height:89px;animation:breathe 5.2s ease-in-out infinite}.legend{display:flex;gap:16px;margin:17px 0 10px;color:var(--muted);font-size:13px}.legend span{display:flex;align-items:center;gap:5px}.mark{width:12px;height:18px;border-radius:100% 0 100% 0;background:#537e5e;transform:rotate(25deg)}.mark.round{width:14px;height:14px;border-radius:50%;background:#94bea7;transform:none}.links{margin-top:17px;color:var(--green);font-weight:650}.event{margin-top:18px;border-top:1px solid var(--line);padding-top:14px;min-height:100px}.daytoggle{margin:12px 0 0;display:flex;gap:8px}.daytoggle button{flex:1;border:1px solid var(--line);background:#fff;color:var(--green);border-radius:12px;padding:10px}.daytoggle button.active{background:var(--green);color:#fff}.note{margin-top:20px;font-size:13px;color:#65736a;text-align:center}@keyframes breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.045)}}@keyframes sway{0%{transform:rotate(-3.5deg)}100%{transform:rotate(3.5deg)}}@media(max-width:470px){.wrap{margin:0 auto}.phone{border-radius:0;min-height:calc(100dvh - 92px);box-shadow:none}.caption{padding-top:9px}}@media(prefers-reduced-motion:reduce){.mascot,.plant{animation:none!important}}
.mascotstage{display:flex;align-items:center;gap:14px;padding:12px 16px;background:linear-gradient(95deg,#e4efe3,#f8efe4);border-radius:22px;min-height:106px;color:#507e62;font-size:13px;font-weight:650}.mascot{touch-action:none;cursor:grab}.mascot:active{cursor:grabbing}.legend span{background:#e7eee4;border-radius:12px;min-height:42px;padding:6px 8px;justify-content:center;flex:1}.legend{gap:8px}.legend span:nth-child(2){background:#e8efeb}.flowerMark{font-style:normal;font-size:20px;line-height:1}.flowerMark.four{color:#b08e54}.flowerMark.five{color:#c78264}#gardenScreen h1{font-size:27px}.screen .card{background:#fcfaf3}</style>
<div class="wrap"><p class="caption">动态示意 · 可切换页面、昼夜并点按小花；以手机实际运行效果为准</p><div class="switches"><button id="promptTab" class="active" onclick="screen('prompt')">打开前</button><button id="gardenTab" onclick="screen('garden')">糯糯的花园</button></div><main class="phone"><section id="prompt" class="screen active"><div class="top"><div class="app"><span class="icon">bili</span><span>bilibili</span></div><span class="close">×</span></div><div class="mascotstage"><img class="mascot big" src="../app/src/main/res/drawable-nodpi/mascot_nuonuo_cutout.png" alt="可轻轻拖动的糯糯"><span>糯糯在这里陪你停一下</span></div><h1>这次打开，<br>想做什么？</h1><p class="sub">选一个目的，再选时长。</p><p class="small">今天第 2 次打开</p><div class="purpose"><button onclick="choose(this)">查找内容</button><button onclick="choose(this)">回复消息</button><button onclick="choose(this)">放松一下</button><button onclick="choose(this)">还没想清楚</button></div><button class="action">这次给我鼓励</button><p class="small">仅本次；结束后恢复原来的提醒设置。</p><p class="note">糯糯约每 2.6 秒轻轻舒展一次，幅度很小。</p></section><section id="gardenScreen" class="screen"><h1>糯糯的花园</h1><div class="card"><div class="top" style="margin-bottom:16px"><strong>本周 · 最近 8 次</strong><span>收起</span></div><div id="garden" class="garden"><span id="sky" class="sky">☀</span><span class="stars">· · · ·</span><div id="plants"></div><img class="mascot" src="../app/src/main/res/drawable-nodpi/mascot_nuonuo_cutout.png" alt="糯糯"></div><div class="legend"><span><i class="flowerMark four">✿</i>四瓣花 · 主动选择</span><span><i class="flowerMark five">✿</i>五瓣花 · 鼓励打开</span></div><div class="links">点一朵小花，看看它从哪里来</div><div id="event" class="event"><strong>选择一朵小花</strong><div class="small">会显示对应应用、时间和当时的选择。</div></div></div><div class="daytoggle"><button id="day" onclick="setDay(false)">白天 · 太阳</button><button id="night" onclick="setDay(true)">夜晚 · 月亮</button></div><p class="note">正式版根据手机系统时间自动切换；这里提供按钮方便预览。</p></section></main></div>
<script>
function screen(which){document.querySelectorAll('.screen,.switches button').forEach(x=>x.classList.remove('active'));document.getElementById(which==='prompt'?'prompt':'gardenScreen').classList.add('active');document.getElementById(which==='prompt'?'promptTab':'gardenTab').classList.add('active')}
function choose(el){document.querySelectorAll('.purpose button').forEach(x=>x.classList.remove('sel'));el.classList.add('sel')}
function setDay(n){document.getElementById('garden').classList.toggle('night',n);document.getElementById('sky').textContent=n?'☾':'☀';document.getElementById('night').classList.toggle('active',n);document.getElementById('day').classList.toggle('active',!n)}
const events=[['leaf','小红书','查找内容 · 查一篇教程'],['bud','微信读书','打开了一次鼓励应用'],['leaf','bilibili','放松一下 · 看一个视频'],['bud','微信读书','打开了一次鼓励应用'],['leaf','番茄免费小说','这次选择先不打开'],['leaf','bilibili','查找内容 · 看课程'],['bud','微信读书','打开了一次鼓励应用'],['leaf','小红书','回复消息']];
const flower=(five)=>{const n=five?5:4,fill=five?'#f1c6af':'#f7ead2',center=five?'#c78264':'#b08e54';let petals='';for(let i=0;i<n;i++){const a=2*Math.PI*i/n-Math.PI/2;petals+=`<circle cx="${25+7*Math.cos(a)}" cy="${26+7*Math.sin(a)}" r="7" fill="${fill}"/>`;}return `<svg viewBox="0 0 50 75" aria-hidden="true"><path d="M25 28 Q28 46 25 70" fill="none" stroke="#789d7c" stroke-width="2"/><ellipse cx="18" cy="53" rx="7" ry="3" fill="#88ad8b" transform="rotate(23 18 53)"/><ellipse cx="31" cy="59" rx="7" ry="3" fill="#88ad8b" transform="rotate(-22 31 59)"/>${petals}<circle cx="25" cy="26" r="4" fill="${center}"/><circle cx="24" cy="25" r="1" fill="#fff"/></svg>`};
document.getElementById('plants').innerHTML=events.map((e,i)=>`<button class="plant p${i+1}" style="animation-delay:${-i*.53}s" aria-label="查看${e[1]}的一次记录" onclick="showEvent(${i})">${flower(e[0]==='bud')}</button>`).join('');
function showEvent(i){const e=events[i];document.getElementById('event').innerHTML=`<strong>${e[0]==='leaf'?'一朵四瓣花的来处':'一朵五瓣花的来处'}</strong><div>${e[1]} · ${e[2]}</div><div class="small">示例记录 · 正式版显示本机真实事件和时间</div>`}
document.querySelectorAll('.mascot').forEach(el=>{let sx=0,sy=0,drag=false;el.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY;drag=false;el.setPointerCapture(e.pointerId);el.style.animationPlayState='paused';el.style.transition='none'});el.addEventListener('pointermove',e=>{if(!el.hasPointerCapture(e.pointerId))return;let dx=e.clientX-sx,dy=e.clientY-sy;if(Math.hypot(dx,dy)>5)drag=true;if(drag)el.style.transform=`translate(${Math.max(-95,Math.min(25,dx))}px,${Math.max(-75,Math.min(25,dy))}px) rotate(${Math.max(-11,Math.min(11,dx/6))}deg) scale(1.06,.94)`});function end(){el.style.transition='transform .42s cubic-bezier(.2,1.4,.4,1)';el.style.transform='';setTimeout(()=>{el.style.animationPlayState='running';el.style.transition=''},450)}el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end)});
setDay(new Date().getHours()<6||new Date().getHours()>=18);
if(new URLSearchParams(location.search).get('screen')==='garden')screen('garden');
</script></html>
